name: Eden Health
description: >-
  Eden Health was a primary and virtual care company that delivered app-based
  medical care, behavioral health, and care navigation to employers and their
  employees, integrating with health systems and insurers (backed by Insight
  Partners). It was surfaced as an Insight Partners portfolio company and added
  to the API Evangelist network for enrichment. Its public marketing site is no
  longer reachable over TLS, but its primary backend service — the "Grdn"
  (Guardian) API at api.edenhealth.com — still serves a Swagger 2.0 description
  covering patients, appointments, membership, documents, care teams, and
  clinician tooling.
