swagger: '2.0'
info:
  version: "1.0"
  title: Grdn grdn.handler grdn.routes.impl.careteam API
  description: Eden Health Inc. primary backend API service.
consumes:
- application/json
produces:
- application/json
tags:
- name: grdn.routes.impl.careteam
  description: null
paths:
  /v2/careteams:
    get:
      summary: get-all-careteams-handler
      description: Gets the careteams from postgres.
      tags:
      - grdn.routes.impl.careteam
      parameters: []
      responses:
        default:
          description: Default success response.
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                created-at: {}
                updated-at: {}
                name:
                  type: string
                empanelment-status:
                  enum:
                  - closed
                  - open
                  - closed_to_new_sponsors
                  type: string
              required:
              - id
              - created-at
              - updated-at
              - name
              - empanelment-status
              title: grdn.specs.careteam/careteam
  /v2/patient/{patient-id}/careteam:
    put:
      summary: update-patient-careteam-handler
      description: Updates a patient's careteam and/or usual provider in Athena.
      tags:
      - grdn.routes.impl.careteam
      parameters:
      - in: path
        name: patient-id
        description: 'origin spec: grdn.specs.careteam/update-patient-careteam-params'
        required: true
        type: string
        format: uuid
      - in: body
        name: grdn.specs.careteam/update-patient-careteam-params
        description: 'origin spec: grdn.specs.careteam/update-patient-careteam-params'
        schema:
          type: object
          properties:
            careteam-id:
              type: string
              format: uuid
            athena-provider-id:
              type: integer
              format: int64
          required:
          - careteam-id
          title: grdn.specs.careteam/update-patient-careteam-params
      responses:
        default:
          description: Default success response.
          schema: {}
    get:
      summary: get-patient-careteam-handler
      description: Gets the patient's careteam id.
      tags:
      - grdn.routes.impl.careteam
      parameters:
      - in: path
        name: patient-id
        description: 'origin spec: grdn.specs.careteam/get-patient-careteam'
        required: true
        type: string
        format: uuid
      responses:
        default:
          description: Default success response.
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
            required:
            - id
            title: grdn.specs.careteam/get-patient-careteam-response
