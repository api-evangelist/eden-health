openapi: 3.2.0
info:
  version: null
  title: Grdn.routes.impl.member API
  description: Eden Health Inc. primary backend API service.
tags:
- name: grdn.routes.impl.member
  description: Handlers for sponsor roster members
paths:
  /v2/member:
    delete:
      summary: delete-member
      description: Deletes a member record.
      tags:
      - grdn.routes.impl.member
      responses:
        default:
          description: Default success response.
          content:
            application/json:
              schema: {}
      operationId: deleteV2Member
      x-operation-id-source: derived
    get:
      summary: get-members
      description: 'Paginated GET handler for rostered patients. Enriches results with isolation reasons and,

        if the sponsor is so entitled, vaccination status. Also adds shared-vaccination-card flag.'
      tags:
      - grdn.routes.impl.member
      parameters:
      - in: query
        name: day
        description: 'origin spec: grdn.specs.member/get-members-params'
        required: false
        x-allOf:
        - type: string
        - {}
        schema:
          type: string
      - in: query
        name: triage-status
        description: 'origin spec: grdn.specs.member/get-members-params'
        required: false
        schema:
          type: string
          enum:
          - triage-status/never-taken
          - triage-status/incomplete
          - triage-status/isolate
          - triage-status/cleared
      - in: query
        name: worksite
        description: 'origin spec: grdn.specs.member/get-members-params'
        required: false
        allowEmptyValue: true
        schema:
          type: string
      - in: query
        name: page-size
        description: 'origin spec: grdn.specs.member/get-members-params'
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: page
        description: 'origin spec: grdn.specs.member/get-members-params'
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: sort-by
        description: 'origin spec: grdn.specs.member/get-members-params'
        required: false
        schema:
          type: string
      - in: query
        name: sort-direction
        description: 'origin spec: grdn.specs.member/get-members-params'
        required: false
        schema:
          type: string
          enum:
          - desc
          - asc
      - in: query
        name: filter
        description: 'origin spec: grdn.specs.member/get-members-params'
        required: false
        schema:
          type: array
          items:
            type: object
            properties:
              operator:
                enum:
                - <=
                - '>'
                - '>='
                - '!='
                - '='
                - <
                type: string
              field:
                type: string
              value:
                type: string
                x-anyOf:
                - type: string
                - type: number
                  format: double
                - type: string
                  x-allOf:
                  - type: string
                  - {}
            required:
            - operator
            - field
            - value
      responses:
        default:
          description: Default success response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    first-name:
                      type: string
                      x-allOf:
                      - type: string
                      - {}
                    athena-document-id:
                      type:
                      - integer
                      - 'null'
                    ingested-version:
                      type: string
                    dob: {}
                    triage-status:
                      enum:
                      - triage-status/never-taken
                      - triage-status/incomplete
                      - triage-status/isolate
                      - triage-status/cleared
                      type:
                      - string
                      - 'null'
                    last-triage-at: {}
                    consent-status:
                      type: string
                    vaccination-status:
                      type:
                      - string
                      - 'null'
                    last-consent-at:
                      x-anyOf:
                      - {}
                      - type: string
                        x-allOf:
                        - type: string
                        - {}
                    id:
                      type: string
                      format: uuid
                    email:
                      type: string
                      x-allOf:
                      - type: string
                      - {}
                    last-name:
                      type: string
                      x-allOf:
                      - type: string
                      - {}
                    updated-at: {}
                    last-test:
                      type:
                      - object
                      - 'null'
                      properties:
                        type:
                          enum:
                          - rapid_molecular
                          - pcr
                          - rapid_antigen
                          - unknown
                          type:
                          - string
                          - 'null'
                        result:
                          enum:
                          - none
                          - positive
                          - inconclusive
                          - negative
                          - pending
                          type:
                          - string
                          - 'null'
                        date-time: {}
                        verified:
                          type: boolean
                      required:
                      - type
                      - result
                      - date-time
                      - verified
                    employee-id:
                      type: string
                    worksite:
                      type:
                      - string
                      - 'null'
                    created-at: {}
                    isolate-reasons:
                      type: string
                    phone:
                      type:
                      - string
                      - 'null'
                    mrn:
                      type: integer
                      format: int64
                      minimum: 1
                    return-to-work-date:
                      type:
                      - string
                      - 'null'
                      x-allOf:
                      - type: string
                      - {}
                      x-anyOf:
                      - type: string
                        x-allOf:
                        - type: string
                        - {}
                      - {}
                    newest-vaccinated-at:
                      type:
                      - string
                      - 'null'
                      x-allOf:
                      - type: string
                      - {}
                  required:
                  - id
                  - created-at
                  - email
                  - employee-id
                  - first-name
                  - last-name
                  - mrn
                  - return-to-work-date
                  - updated-at
                  - worksite
                  - consent-status
                  - dob
                  - ingested-version
                  - last-consent-at
                  - last-test
                  - last-triage-at
                  - phone
                  - triage-status
                  title: grdn.specs.member/members-details
      operationId: getV2Member
      x-operation-id-source: derived
    put:
      summary: update-member
      description: Updates a member record with the given patient ID.
      tags:
      - grdn.routes.impl.member
      responses:
        default:
          description: Default success response.
          content:
            application/json:
              schema: {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sponsor-id:
                  type: string
                  format: uuid
                employee-id:
                  type: string
                patient-id:
                  type: string
                  format: uuid
              required:
              - sponsor-id
              - employee-id
              - patient-id
              title: grdn.specs.member/update-member-params
        description: 'origin spec: grdn.specs.member/update-member-params'
      operationId: putV2Member
      x-operation-id-source: derived
  /v2/member/{member-id}:
    get:
      summary: get-member
      description: 'GET handler for specific member. Returns the member record enriched with the following:

        - patient MRN

        - patient creation time

        - any covid_registry records'' creation time & triage status

        - isolate reasons and vaccination status, if the sponsor is so entitled

        - shared-vaccination-card flag'
      tags:
      - grdn.routes.impl.member
      parameters:
      - in: path
        name: member-id
        description: 'origin spec: grdn.specs.member/get-member-params'
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          description: Default success response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  first-name:
                    type: string
                    x-allOf:
                    - type: string
                    - {}
                  ingested-version:
                    type: string
                  dob: {}
                  vaccine-details:
                    type: array
                    items:
                      type: object
                      properties:
                        vaccine-id:
                          type: string
                        manufacturer:
                          enum:
                          - UNK
                          - PFR
                          - MOD
                          - JSN
                          type: string
                        lot-number:
                          type: string
                        vaccinated-at: {}
                        athena-document-id:
                          type:
                          - integer
                          - 'null'
                        dose:
                          type:
                          - integer
                          - 'null'
                      required:
                      - vaccine-id
                      - manufacturer
                      - lot-number
                      - vaccinated-at
                      - athena-document-id
                      - dose
                  vaccination-status:
                    type:
                    - string
                    - 'null'
                  patient-id:
                    type: string
                    format: uuid
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    x-allOf:
                    - type: string
                    - {}
                  last-name:
                    type: string
                    x-allOf:
                    - type: string
                    - {}
                  updated-at: {}
                  covid-registry:
                    type: array
                    items:
                      type: object
                      properties:
                        created-at: {}
                        triage-status:
                          enum:
                          - triage-status/never-taken
                          - triage-status/incomplete
                          - triage-status/isolate
                          - triage-status/cleared
                          type:
                          - string
                          - 'null'
                        isolate-reasons:
                          type: string
                      required:
                      - created-at
                      - triage-status
                      title: grdn.specs.member/covid-registry-entry
                  employee-id:
                    type: string
                  worksite:
                    type:
                    - string
                    - 'null'
                  created-at: {}
                  isolate-reasons:
                    type: string
                  phone:
                    type:
                    - string
                    - 'null'
                  personal-phone:
                    type:
                    - string
                    - 'null'
                  personal-email:
                    type: string
                required:
                - ingested-version
                - id
                - updated-at
                - created-at
                - email
                - last-name
                - first-name
                - phone
                - worksite
                - employee-id
                - patient-id
                - personal-email
                - personal-phone
                - dob
                - covid-registry
                - vaccine-details
                title: grdn.specs.member/get-member-response
      operationId: getV2MemberByMemberId
      x-operation-id-source: derived
  /v2/member/{member-id}/covid-testing:
    get:
      summary: get-covid-testing-results-handler
      description: Gets a member's COVID testing results.
      tags:
      - grdn.routes.impl.member
      parameters:
      - in: path
        name: member-id
        description: 'origin spec: grdn.specs/get-covid-testing-params'
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          description: Default success response.
          content:
            application/json:
              schema: {}
      operationId: getV2MemberByMemberIdCovidTesting
      x-operation-id-source: derived
  /v2/member/{member-id}/document/vaccine/{document-id}:
    get:
      summary: get-member-vaccine-document-handler
      description: Gets a members vaccine document/card image.
      tags:
      - grdn.routes.impl.member
      parameters:
      - in: path
        name: member-id
        description: 'origin spec: grdn.specs/get-covid-testing-params'
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: document-id
        description: 'origin spec: grdn.specs/get-covid-testing-params'
        required: true
      responses:
        default:
          description: Default success response.
          content:
            application/json:
              schema: {}
      operationId: getV2MemberByMemberIdDocumentVaccineByDocumentId
      x-operation-id-source: derived
  /v2/sponsor/{sponsor-id}/members:
