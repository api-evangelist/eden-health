          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    first-name:
                      type: string
                      x-allOf:
                      - type: string
                      - {}
                    athena-document-id:
                      type:
                      - integer
                      - 'null'
                    ingested-version:
                      type: string
                    dob: {}
                    triage-status:
                      enum:
                      - triage-status/never-taken
                      - triage-status/incomplete
                      - triage-status/isolate
                      - triage-status/cleared
                      type:
                      - string
                      - 'null'
                    last-triage-at: {}
                    consent-status:
                      type: string
                    vaccination-status:
                      type:
                      - string
                      - 'null'
                    last-consent-at:
                      x-anyOf:
                      - {}
                      - type: string
                        x-allOf:
                        - type: string
                        - {}
                    id:
                      type: string
                      format: uuid
                    email:
                      type: string
                      x-allOf:
                      - type: string
                      - {}
                    last-name:
                      type: string
                      x-allOf:
                      - type: string
                      - {}
                    updated-at: {}
                    last-test:
                      type:
                      - object
                      - 'null'
                      properties:
                        type:
                          enum:
                          - rapid_molecular
                          - pcr
                          - rapid_antigen
                          - unknown
                          type:
                          - string
                          - 'null'
                        result:
                          enum:
                          - none
                          - positive
                          - inconclusive
                          - negative
                          - pending
                          type:
                          - string
                          - 'null'
                        date-time: {}
                        verified:
                          type: boolean
                      required:
                      - type
                      - result
                      - date-time
                      - verified
                    employee-id:
                      type: string
                    worksite:
                      type:
                      - string
                      - 'null'
                    created-at: {}
                    isolate-reasons:
                      type: string
                    phone:
                      type:
                      - string
                      - 'null'
                    mrn:
                      type: integer
                      format: int64
                      minimum: 1
                    return-to-work-date:
                      type:
                      - string
                      - 'null'
                      x-allOf:
                      - type: string
                      - {}
                      x-anyOf:
                      - type: string
                        x-allOf:
                        - type: string
                        - {}
                      - {}
                    newest-vaccinated-at:
                      type:
                      - string
                      - 'null'
                      x-allOf:
                      - type: string
                      - {}
                  required:
                  - id
                  - created-at
                  - email
                  - employee-id
                  - first-name
                  - last-name
                  - mrn
                  - return-to-work-date
                  - updated-at
                  - worksite
                  - consent-status
                  - dob
                  - ingested-version
                  - last-consent-at
                  - last-test
                  - last-triage-at
                  - phone
                  - triage-status
                  title: grdn.specs.member/members-details
      operationId: getV2SponsorBySponsorIdMembers
      x-operation-id-source: derived
