                      x-allOf:
                      - type: string
                      - {}
                    last-name:
                      type: string
                      x-allOf:
                      - type: string
                      - {}
                    updated-at: {}
                    employee-id:
                      type: string
                    worksite:
                      type:
                      - string
                      - 'null'
                    created-at: {}
                    phone:
                      type:
                      - string
                      - 'null'
                  required:
