openapi: 3.2.0
info:
  version: null
  title: Grdn.routes.impl.assignment API
  description: Eden Health Inc. primary backend API service.
tags:
- name: grdn.routes.impl.assignment
  description: Contains handlers for routes related to provider patient assignments.
paths:
  /v2/patient/{patient-id}/assign:
    post:
      summary: assign-handler
      description: Assigns providers to a patient. If channel is archived, updates status to pending.
      tags:
      - grdn.routes.impl.assignment
      parameters:
      - in: path
        name: patient-id
        description: 'origin spec: grdn.specs.assignment/assign-params'
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          description: Default success response.
          content:
            application/json:
              schema: {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider-ids:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - provider-ids
              title: grdn.specs.assignment/assign-params
        description: 'origin spec: grdn.specs.assignment/assign-params'
      operationId: postV2PatientByPatientIdAssign
      x-operation-id-source: derived
  /v2/patient/{patient-id}/unassign:
    post:
      summary: unassign-handler
      description: Un-assigns providers from a patient.
      tags:
      - grdn.routes.impl.assignment
      parameters:
      - in: path
        name: patient-id
        description: 'origin spec: grdn.specs.assignment/unassign-params'
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          description: Default success response.
          content:
            application/json:
              schema: {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider-ids:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - provider-ids
              title: grdn.specs.assignment/unassign-params
        description: 'origin spec: grdn.specs.assignment/unassign-params'
      operationId: postV2PatientByPatientIdUnassign
      x-operation-id-source: derived
