                  type: object
                  properties:
                    athena-username:
                      type:
                      - string
                      - 'null'
                    google-id:
                      type: string
                    entity-type:
                      type:
                      - string
                      - 'null'
                    licenses:
                      type:
                      - array
                      - 'null'
                      items:
                        type: string
                    provider-type:
                      type: string
                    headshot-url:
                      type:
                      - string
                      - 'null'
                    display-name:
                      type: string
                    sendbird-user-id:
                      type: string
                      format: uuid
                    zoom-id:
                      type:
                      - string
                      - 'null'
                    id:
                      type: string
                      format: uuid
                    updated-at: {}
                    created-at: {}
                    careteam-id:
                      type:
                      - string
                      - 'null'
                      format: uuid
                    channel-user-id:
                      type: string
                      format: uuid
                    is-closeknit-credentialed:
                      type:
                      - boolean
                      - 'null'
                    athena-provider-ids:
                      type: array
                      items:
                        type: object
                        properties:
                          provider-group:
                            type:
                            - string
                            - 'null'
                          provider-group-id:
                            type:
                            - integer
                            - 'null'
                            format: int64
                            minimum: 1
                          provider-id:
                            type:
                            - integer
                            - 'null'
                            format: int64
                            minimum: 1
                        required:
                        - provider-group
                        - provider-group-id
                        - provider-id
                        title: grdn.specs.provider/athena-provider-id
                  required:
                  - athena-username
                  - id
                  - careteam-id
                  - channel-user-id
                  - created-at
                  - display-name
                  - google-id
                  - headshot-url
                  - licenses
                  - provider-type
                  - sendbird-user-id
                  - updated-at
                  - zoom-id
                  - is-closeknit-credentialed
      operationId: getV2ClinicianDetails
