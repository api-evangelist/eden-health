                  type: object
                  properties:
                    patient-id:
                      type: string
                      format: uuid
                    status:
                      type: string
                    assigned-provider-ids:
                      type: array
                      items:
                        type: string
                        format: uuid
                    tag-ids:
                      type: array
                      items:
                        type: string
                        format: uuid
                    last-message:
                      type: object
                      properties:
                        message-type:
                          type: string
                        sender:
                          type: object
