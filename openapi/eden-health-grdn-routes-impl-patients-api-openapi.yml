                      type: boolean
                    first-name:
                      type: string
                      x-allOf:
                      - type: string
                      - {}
                    preferred-name:
                      type: string
                      x-nullable: true
                    assigned:
                      type: array
                      items:
                        type: string
                        format: uuid
                    sendbird-user-id:
                      type: string
                      format: uuid
                    id:
                      type: string
                      format: uuid
                    last-name:
                      type: string
                      x-allOf:
                      - type: string
                      - {}
                    location:
                      type: object
                      properties:
                        state:
                          type: string
                          x-allOf:
                          - type: string
                          - {}
                        valid:
                          type: boolean
                      required:
                      - state
                      - valid
                      title: grdn.specs.patients/location
                    careteam-id:
                      type: string
                      format: uuid
                    sponsor-id:
                      type: string
                      format: uuid
