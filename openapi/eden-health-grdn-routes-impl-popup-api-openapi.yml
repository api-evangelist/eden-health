                  x-nullable: true
              zip:
                type: string
                x-allOf:
                - type: string
                - {}
                x-nullable: true
            required:
            - sponsor-id
            - date
            - name
            - athena-reason-id
            - athena-scheduling-provider-id
            - address-1
            - city
            - state
            - zip
            - popup-state
            - created-at
            - updated-at
            - id
            - instructions
