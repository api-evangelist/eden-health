openapi: 3.2.0
info:
  version: null
  title: Grdn.routes.impl.popup API
  description: Eden Health Inc. primary backend API service.
tags:
- name: grdn.routes.impl.popup
  description: Simple CRUD operations for popups.
paths:
  /v2/popup:
    get:
      summary: get-popups-handler
      description: Returns popups depending on the category parameter and populates the start and end dates if possible.
      tags:
      - grdn.routes.impl.popup
      parameters:
      - in: query
        name: popup-category
        description: 'origin spec: grdn.specs.popup/get-popup-params'
        required: false
        schema:
          type: string
          enum:
          - past
          - draft
          - active
      responses:
        default:
          description: Default success response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    end-date: {}
                    end-time:
                      type:
                      - string
                      - 'null'
                    start-time:
                      type:
                      - string
                      - 'null'
                    athena-reason-id:
                      type: integer
                      format: int64
                    city:
                      type:
                      - string
                      - 'null'
                      x-allOf:
                      - type: string
                      - {}
                    address-1:
                      type:
                      - string
                      - 'null'
                      x-allOf:
                      - type: string
                      - {}
                    athena-department-id:
                      type:
                      - integer
                      - 'null'
                      format: int64
                    id:
                      type: string
                      format: uuid
                    athena-scheduling-provider-id:
                      type:
                      - integer
                      - 'null'
                      format: int64
                    updated-at: {}
                    popup-state:
                      enum:
                      - draft
                      - active
                      type: string
                    name:
                      type: string
                    created-at: {}
                    instructions:
                      type:
                      - string
                      - 'null'
                    eligible-members:
                      enum:
                      - employees_and_dependents
                      - employees_only
                      type: string
                    sponsor-id:
                      type: string
                      format: uuid
                    address-2:
                      type:
                      - string
                      - 'null'
                    popup-dates:
                      type: array
                      items:
                        type: object
                        properties:
                          start-time:
                            type:
                            - string
                            - 'null'
                          end-time:
                            type:
                            - string
                            - 'null'
                        required:
                        - start-time
                        - end-time
                        title: grdn.specs.popup/popup-date
                    state:
                      type:
                      - string
                      - 'null'
                      x-allOf:
                      - type: string
                      - {}
                    time-zone-id:
                      type: string
                    date: {}
                    division-ids:
                      type: array
                      items:
                        type:
                        - string
                        - 'null'
                        format: uuid
                    zip:
                      type:
                      - string
                      - 'null'
                      x-allOf:
                      - type: string
                      - {}
                  required:
                  - sponsor-id
                  - date
                  - name
                  - athena-reason-id
                  - athena-scheduling-provider-id
                  - athena-department-id
                  - address-1
                  - address-2
                  - city
                  - state
                  - zip
                  - popup-state
                  - created-at
                  - updated-at
                  - id
                  - instructions
                  - time-zone-id
                  title: grdn.specs.popup/get-popup-response
      operationId: getV2Popup
      x-operation-id-source: derived
