              - active
              type: string
            name:
              type: string
            instructions:
              type: string
              allowEmptyValue: true
            eligible-members:
              enum:
              - employees_and_dependents
              - employees_only
              type: string
            address-2:
              type: string
              allowEmptyValue: true
            state:
              type: string
              x-allOf:
              - type: string
              - {}
              allowEmptyValue: true
            time-zone-id:
              type: string
            date:
              type: string
              x-allOf:
              - type: string
              - {}
            division-ids:
              type: array
              items:
                type: string
                format: uuid
                allowEmptyValue: true
            zip:
              type: string
              x-allOf:
              - type: string
              - {}
              allowEmptyValue: true
          title: grdn.specs.popup/update-popup-params
      responses:
        default:
          description: Default success response.
          schema:
            type: object
            properties:
              end-date: {}
              end-time:
                type: string
                x-nullable: true
              start-time:
                type: string
                x-nullable: true
              athena-reason-id:
                type: integer
                format: int64
              city:
                type: string
                x-allOf:
                - type: string
                - {}
                x-nullable: true
              address-1:
                type: string
                x-allOf:
                - type: string
                - {}
                x-nullable: true
              id:
                type: string
                format: uuid
              athena-scheduling-provider-id:
                type: integer
                format: int64
                x-nullable: true
              updated-at: {}
              popup-state:
                enum:
                - draft
                - active
                type: string
              name:
                type: string
              created-at: {}
              instructions:
                type: string
                x-nullable: true
              eligible-members:
                enum:
                - employees_and_dependents
                - employees_only
                type: string
              sponsor-id:
                type: string
                format: uuid
              address-2:
                type: string
                x-nullable: true
              state:
                type: string
                x-allOf:
                - type: string
                - {}
                x-nullable: true
              time-zone-id:
                type: string
              date: {}
              division-ids:
                type: array
                items:
                  type: string
